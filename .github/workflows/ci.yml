name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Upload browser evidence when verification fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-overflow-${{ github.sha }}
          path: output/playwright/browser-overflow/
          if-no-files-found: ignore
      - run: RESUMILIO_SCAN_HISTORY=1 npm run scan:clean
