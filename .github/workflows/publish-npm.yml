name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag to publish
        required: true
        default: v0.8.0

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Validate immutable tag and package version
        shell: bash
        run: |
          test "${{ inputs.tag }}" = "v$(node -p "require('./package.json').version")"
          test "$(git describe --tags --exact-match HEAD)" = "${{ inputs.tag }}"
      - run: npm ci
      - name: Run the release contract
        run: npm run phase6
        env:
          RESUMILIO_LIGHTHOUSE_OUTPUT_DIR: qa-artifacts/lighthouse
      - name: Verify rendered browser experience
        run: npm run verify:browser-quality
        env:
          RESUMILIO_QA_OUTPUT_DIR: qa-artifacts/browser
      - name: Pack and smoke-test the exact tarball
        run: npm run release:pack
      - name: Publish with provenance
        run: npm publish release-artifacts/resumilio-0.8.0.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
